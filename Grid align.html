<!DOCTYPE html>
<html>
<head>
<style>

.container {
    display: grid;
    grid-template-columns: auto auto auto;
    justify-content: end;
    background-color: dodgerblue;
    padding: 10px;
}

.container1 {
    display: grid;
    grid-template-columns: auto auto auto;
    padding: 10px;
    background-color: dodgerblue;
    font-size: 30px;
    text-align: center;
}
.container2 {
    display: grid;
    grid-template-columns: 80px 500px auto;
    grid-template-rows: 50px 50px;
    background-color: dodgerblue;
    padding: 10px;
    justify-content: end;
}

.container div {
    background-color: #f1f1f1;
    border: 1px solid black;
    padding: 10px;
    font-size: 30px;
    text-align: center;
}

.container1 div {
    background-color: #f1f1f1;
    border: 1px solid black;
    padding: 10px;
    font-size: 30px;
    text-align: center;
}
.container2 div {
    background-color: #f1f1f1;
    border: 1px solid black;
    padding: 10px;
    font-size: 30px;
    text-align: center;
}

</style>
</head>

<body>

<h1>Grid Layout 1</h1>

<div class="container">
    <div>1</div>
    <div>2</div>
    <div>3</div>
    <div>4</div>
    <div>5</div>
</div>

<h1>Grid Layout 2</h1>

<div class="container1">
    <div>1</div>
    <div>2</div>
    <div>3</div>
    <div>4</div>
</div>

<h2>Grid Layout 3</h2>
<div class="container2">
    <div>S.No.</div>
    <div>Name</div>
    <div>12th %</div>
    <div>1</div>
    <div>KATHIRESHWARAN L</div>
    <div>87.83%</div>

</body>
</html>
