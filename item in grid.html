<!DOCTYPE html>
<html>
<head>
<style>
.container {
    display: grid;
    grid-template-columns: auto auto auto;
    gap:50px;
    background-color: dodgerblue;
    padding: 5px;
}
.container div {
    background-color: #f1f1f1;
    padding: 10px;
    font-size: 30px;
    text-align: center;
}
.item1{
    grid-column-start: 1;
    grid-column-end: 5;
}
</style>
</head>
<body>
<h1>The Grid colunn-start and column-end properties</h1>
<div class="container"> 
  <div class="item1">1</div>
  <div class="item2">2</div>
  <div class="item3">3</div>    
  <div class="item4">4</div>
  <div class="item5">5</div>
</div>
</body>
</html>
