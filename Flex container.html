<!DOCTYPE html>
<html>
<head>
<style>
.container{
    display:flex;
    background-color:Dodgerblue;
    flex-direction:column-reverse;
    }
.container div{
    background-color: #f1f1f1;
    padding: 20px;
    font-size: 24px;
    margin:10px;
}
</style>
</head>
<body>
<h1>Create a Flex container</h1>
<div class="container">
    <div>Item 1</div>
    <div>Item 2</div> 
    <div>Item 3</div>
    <div>Item 4</div>
    <div>Item 5</div>
    <div>Item 6</div>
    <div>Item 7</div>
    <div>Item 8</div>
</div>
<p>Flexbox must have a parent element with the display property set to flex.</p>
<p>Direct child elements of a flex container are automatically flex items.</p>
</p>
</body>
</html>
